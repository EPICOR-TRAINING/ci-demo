name: oidc-smoke-test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (keyless via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Setup 12 §6: trust-only smoke test — the SP has no RBAC yet, so
          # omit subscription-id and skip subscription enumeration.
          # Once AcrPush lands, re-add `subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}`
          # and drop `allow-no-subscriptions`.
          allow-no-subscriptions: true

      - name: Prove the token exchange
        run: |
          echo "--- account (tenant only until RBAC is granted) ---"
          az account show -o json || true
          echo "--- signed-in service principal ---"
          az account list -o json
