name: checkout — ACR push (OIDC) + GitOps bump
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/checkout/**"]

permissions:
  id-token: write   # OIDC token exchange with Azure
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_NAME }}.azurecr.io/checkout-service:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Azure login (keyless via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login (via az acr login)
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ACR
        uses: docker/build-push-action@v6
        with:
          context: services/checkout
          file: services/checkout/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops-handoff:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ci-gitops
        uses: actions/checkout@v4
        with:
          repository: EPICOR-TRAINING/ci-gitops
          token: ${{ secrets.GITOPS_APP_TOKEN }}
          ref: main
          path: ci-gitops

      - name: Bump image reference in base/deployment.yaml
        working-directory: ci-gitops
        env:
          NEW_TAG: ${{ needs.build-push.outputs.image_tag }}
          ACR: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          FILE=apps/checkout-service/base/deployment.yaml
          NEW_REF="${ACR}.azurecr.io/checkout-service:${NEW_TAG}"
          echo "New image: ${NEW_REF}"
          sed -i.bak -E "s|image: ${ACR}\.azurecr\.io/checkout-service:.*|image: ${NEW_REF}|" "$FILE"
          rm -f "${FILE}.bak"
          echo "--- diff ---"
          git diff -- "$FILE" || true

      - name: Commit & push to ci-gitops
        working-directory: ci-gitops
        env:
          NEW_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name  "ci-demo-bot"
          git config user.email "ci-demo-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "no manifest change; nothing to commit"
            exit 0
          fi
          git add apps/checkout-service/base/deployment.yaml
          git commit -m "checkout-service: bump image to ${NEW_TAG} (from ci-demo ${{ github.sha }})"
          git push origin main
