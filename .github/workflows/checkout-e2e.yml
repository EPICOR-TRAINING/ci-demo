name: Checkout — E2E (Test → Build → ACR → GitOps)

on:
  push:
    branches: [main]
    paths: ["services/checkout/**"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token exchange with Azure
  contents: read

env:
  SERVICE: checkout
  WORKDIR: services/checkout
  IMAGE_REPO: checkout-service
  GITOPS_REPO: EPICOR-TRAINING/ci-gitops
  GITOPS_BRANCH: main
  GITOPS_IMAGE_PATH: apps/checkout-service/base/deployment.yaml

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) TEST — install deps & run unit tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/checkout
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/checkout/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # 2) BUILD — verify app builds (syntax / bundling)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/checkout
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/checkout/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (syntax check)
        run: node --check app.js

      - name: Read service version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # 3) DOCKER — build image and push to Azure Container Registry
  #    Uses OIDC (keyless) → azure/login → az acr login
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push (ACR)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image_ref: ${{ steps.tag.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ needs.build.outputs.version }}-${SHORT_SHA}"
          IMAGE_REF="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Image will be: ${IMAGE_REF}"

      - name: Azure login (keyless via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login (via az acr login)
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/checkout
          file: services/checkout/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image_ref }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 4) GITOPS — update image tag in the manifest repo
  # ─────────────────────────────────────────────────────────────
  gitops:
    name: Update GitOps Repo
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ci-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_APP_TOKEN }}
          path: ci-gitops

      - name: Bump image reference in deployment.yaml
        working-directory: ci-gitops
        env:
          IMAGE_REF: ${{ needs.docker.outputs.image_ref }}
          ACR: ${{ vars.ACR_NAME }}
          FILE: ${{ env.GITOPS_IMAGE_PATH }}
        run: |
          set -euo pipefail
          echo "New image: ${IMAGE_REF}"
          sed -i.bak -E "s|image: ${ACR}\.azurecr\.io/${{ env.IMAGE_REPO }}:.*|image: ${IMAGE_REF}|" "$FILE"
          rm -f "${FILE}.bak"
          echo "--- diff ---"
          git diff -- "$FILE" || true

      - name: Commit & push to ci-gitops
        working-directory: ci-gitops
        env:
          IMAGE_REF: ${{ needs.docker.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name  "ci-demo-bot"
          git config user.email "ci-demo-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "no manifest change; nothing to commit"
            exit 0
          fi
          git add "${{ env.GITOPS_IMAGE_PATH }}"
          git commit -m "checkout-service: bump image to ${IMAGE_TAG} (from ci-demo ${{ github.sha }})"
          git push origin "${{ env.GITOPS_BRANCH }}"

      - name: Summary
        run: |
          {
            echo "## Checkout E2E — Summary"
            echo ""
            echo "| Stage  | Result |"
            echo "|--------|--------|"
            echo "| Test   | passed |"
            echo "| Build  | passed |"
            echo "| Image  | \`${{ needs.docker.outputs.image_ref }}\` |"
            echo "| GitOps | \`${{ env.GITOPS_REPO }}\` → \`${{ env.GITOPS_IMAGE_PATH }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
